<!DOCTYPE html>

<!-- İki ekran, tek iş: LİSTE = "bugün ne var", ODAK = "şu an ne yapıyorum" -->
<main id="list-screen" class="screen on"></main>
<main id="focus-screen" class="screen"></main>
<main id="warmup-screen" class="screen"></main>
<main id="settings-screen" class="screen"></main>
<main id="profile-screen" class="screen"></main>
<main id="history-screen" class="screen"></main>
<main id="session-screen" class="screen"></main>
<main id="summary-screen" class="screen"></main>
<main id="programs-screen" class="screen"></main>

<main id="picker-screen" class="screen"></main>

<main id="exercise-screen" class="screen"></main>
<main id="add-screen" class="screen"></main>
<main id="welcome-screen" class="screen"></main>
<main id="preset-screen" class="screen"></main>

<input type="file" id="file" accept="application/json,.json" hidden>

<!-- AÇILIŞ (11 Eki, Sabri seçti: B "sade", ~1,15 sn): FS işareti sistem açılışının yerinden yukarı süzülür,
     ad ve slogan belirir, ekran solar. Yalnız SOĞUK açılışta (sayfa yüklenirken) var; dokununca geçilir.
     Ad js/marka.js'ten gelir (tek yer). JS çalışmazsa CSS 3 sn sonra kendisi gizler — uygulama kilitlenmez. -->
<div id="acilis" class="acilis" aria-hidden="true">
  <img class="isaret" src="icons/isaret.svg" alt="" width="144" height="84">
  <div class="kelime"><span class="k1"></span><span class="k2"></span></div>
  <div class="slogan"></div>
</div>

<script type="module" src="js/app.js"></script>
<noscript><p style="padding:24px;font:16px system-ui">Bu uygulama JavaScript gerektirir.</p></noscript>
